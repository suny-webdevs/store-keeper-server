services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: store-keeper-server
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-"postgresql://postgres.wteimlnpygsyhkpgrafk:AzU0BY2yjHJLkhSm@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?pgbouncer=true"}
      DIRECT_URL: ${DIRECT_URL:-"postgresql://postgres.wteimlnpygsyhkpgrafk:AzU0BY2yjHJLkhSm@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres"}
      REDIS_URL: ${REDIS_URL:-"rediss://default:gQAAAAAAAtNOAAIgcDE1MDZiMTBkZTUxZDU0OGNjOWE4ODhhNWU0YmJlMjYwOQ@uncommon-mullet-185166.upstash.io:6379"}
      SUPABASE_URL: ${SUPABASE_URL:-https://wteimlnpygsyhkpgrafk.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SENTRY_DSN: ${SENTRY_DSN:-"https://daf6bb33d28c9203c34c5386574ecfa5@o4512400844587008.ingest.us.sentry.io/4512400881418240"}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dzarjul50}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-372397489471433}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-HknkYFB-QG7c7ft86t1HDjiOEHg}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - storekeeper-network

  postgres:
    image: postgres:16-alpine
    container_name: store-keeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-storekeeper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-storekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storekeeper-network

  redis:
    image: redis:7-alpine
    container_name: store-keeper-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - storekeeper-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  storekeeper-network:
    driver: bridge

